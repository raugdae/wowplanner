# Client WoW Planner : exécutables Windows et macOS (PyInstaller, addon inclus), joints à une release GitHub.
# Lancement : pousser un tag « client-v1.0.0 » (ou à la main depuis l'onglet Actions, sans release).
name: Client WoW Planner

on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: WowPlanner-Windows.zip
          - os: macos-latest
            artifact: WowPlanner-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: pip install pyinstaller==6.11.1 certifi
      - name: Exécutable
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --noconfirm --windowed --onefile --name WowPlanner \
            --add-data "addon/WowPlanner${SEP}addon/WowPlanner" client/wowplanner_client.py
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/WowPlanner.exe -DestinationPath ${{ matrix.artifact }}
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent WowPlanner.app ../${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: WowPlanner-*.zip
          make_latest: true
